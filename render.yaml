services:
  - type: web
    name: mindfeed
    runtime: static
    buildCommand: npm ci && npm run build -- --configuration=production && echo "/* /index.html 200" > dist/mindfeed/browser/_redirects && cp dist/mindfeed/browser/index.html dist/mindfeed/browser/404.html
    staticPublishPath: dist/mindfeed/browser
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
