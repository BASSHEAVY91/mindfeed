name: CI/CD → Render

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    name: Build Angular & Deploy to Render
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
        run: npm run build -- --configuration=production

      - name: Ensure SPA fallback files in dist
        run: |
          echo "/* /index.html 200" > dist/mindfeed/browser/_redirects
          cp dist/mindfeed/browser/index.html dist/mindfeed/browser/404.html
          echo "✅ _redirects and 404.html written to dist/mindfeed/browser/"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

      - name: Trigger Render deploy
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -s -X POST "$RENDER_DEPLOY_HOOK"
            echo "✅ Render deploy hook triggered"
          else
            echo "⚠️  RENDER_DEPLOY_HOOK secret not set – skipping auto-deploy"
          fi
